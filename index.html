<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Corrida Relâmpago</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#111;
  font-family:Arial,sans-serif;
  color:white;
  text-align:center;
  overflow:hidden;
}

h1{
  margin:12px 0 5px;
}

#info{
  font-size:18px;
  margin-bottom:8px;
}

#game{
  position:relative;
  width:400px;
  height:600px;
  max-width:95vw;
  margin:auto;
  overflow:hidden;
  background:#555;
  border:5px solid white;
  border-radius:10px;
}

#road{
  position:absolute;
  left:60px;
  right:60px;
  top:0;
  bottom:0;
  background:#333;
  border-left:6px solid #eee;
  border-right:6px solid #eee;
}

.line{
  position:absolute;
  width:8px;
  height:80px;
  background:white;
  left:50%;
  transform:translateX(-50%);
}

#car{
  position:absolute;
  width:50px;
  height:85px;
  bottom:30px;
  left:175px;
  background:#e53935;
  border-radius:10px;
  border:3px solid white;
  z-index:10;
}

#car:before{
  content:"";
  position:absolute;
  width:34px;
  height:28px;
  left:5px;
  top:10px;
  background:#80deea;
  border-radius:5px;
}

#car:after{
  content:"";
  position:absolute;
  width:8px;
  height:15px;
  background:#111;
  left:-6px;
  top:15px;
  box-shadow:
    54px 0 #111,
    0 45px #111,
    54px 45px #111;
}

.enemy{
  position:absolute;
  width:50px;
  height:85px;
  background:#1976d2;
  border-radius:10px;
  border:3px solid white;
  z-index:5;
}

.enemy:before{
  content:"";
  position:absolute;
  width:34px;
  height:28px;
  left:5px;
  top:10px;
  background:#90caf9;
  border-radius:5px;
}

#menu{
  position:absolute;
  inset:0;
  background:rgba(0,0,0,.9);
  z-index:100;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  padding:20px;
}

#menu h2{
  font-size:34px;
  margin:10px;
}

button{
  border:0;
  border-radius:10px;
  padding:14px 25px;
  margin:6px;
  font-size:18px;
  font-weight:bold;
  cursor:pointer;
}

#start{
  background:#00c853;
  color:white;
}

#levels{
  background:#2979ff;
  color:white;
}

#back{
  background:#777;
  color:white;
}

.hidden{
  display:none !important;
}

#message{
  position:absolute;
  top:15px;
  left:0;
  right:0;
  z-index:50;
  font-size:22px;
  font-weight:bold;
  text-shadow:2px 2px 3px black;
}

#controls{
  margin-top:10px;
}

.control{
  width:90px;
  height:55px;
  font-size:25px;
  background:#333;
  color:white;
  border:2px solid white;
}

@media(max-width:500px){
  #game{
    height:520px;
  }

  #road{
    left:45px;
    right:45px;
  }
}
</style>
</head>

<body>

<h1>🏎️ Corrida Relâmpago</h1>

<div id="info">
  Pontos: <span id="score">0</span>
  &nbsp; | &nbsp;
  Recorde: <span id="best">0</span>
</div>

<div id="game">

  <div id="road"></div>

  <div id="message"></div>

  <div id="car"></div>

  <div id="menu">

    <h2 id="menuTitle">🏎️ Corrida Relâmpago</h2>

    <p id="subtitle">
      Desvia dos carros e chega à meta!
    </p>

    <div id="mainMenu">
      <button id="start">JOGAR</button>
      <button id="levels">🏁 NÍVEIS</button>
    </div>

    <div id="levelMenu" class="hidden">
      <button class="levelBtn" data-level="1">
        🐢 NÍVEL 1 - FÁCIL
      </button>

      <button class="levelBtn" data-level="2">
        🚗 NÍVEL 2 - NORMAL
      </button>

      <button class="levelBtn" data-level="3">
        🔥 NÍVEL 3 - DIFÍCIL
      </button>

      <button class="levelBtn" data-level="4">
        ⚡ NÍVEL 4 - EXTREMO
      </button>

      <button id="back">
        VOLTAR
      </button>
    </div>

  </div>
</div>

<div id="controls">
  <button class="control" id="left">⬅️</button>
  <button class="control" id="right">➡️</button>
</div>

<script>

const game = document.getElementById("game");
const car = document.getElementById("car");

const scoreText = document.getElementById("score");
const bestText = document.getElementById("best");

const menu = document.getElementById("menu");
const mainMenu = document.getElementById("mainMenu");
const levelMenu = document.getElementById("levelMenu");

const startButton = document.getElementById("start");
const levelsButton = document.getElementById("levels");
const backButton = document.getElementById("back");

const menuTitle = document.getElementById("menuTitle");
const subtitle = document.getElementById("subtitle");

const leftButton = document.getElementById("left");
const rightButton = document.getElementById("right");

let running = false;
let score = 0;
let best = Number(localStorage.getItem("corridaBest") || 0);

let level = 1;
let speed = 4;
let enemyTimer = 0;

let carX = 175;

let keys = {
  left:false,
  right:false
};

bestText.textContent = best;


/* =========================
   ESTRADA
========================= */

for(let i=0;i<7;i++){

  const line = document.createElement("div");

  line.className = "line";

  line.style.top = (i * 100 - 100) + "px";

  game.appendChild(line);
}


/* =========================
   NÍVEIS
========================= */

function setLevel(l){

  level = l;

  if(level === 1){
    speed = 4;
  }

  if(level === 2){
    speed = 5;
  }

  if(level === 3){
    speed = 6;
  }

  if(level === 4){
    speed = 7;
  }
}


/* =========================
   MENU
========================= */

levelsButton.onclick = function(){

  mainMenu.classList.add("hidden");
  levelMenu.classList.remove("hidden");

  menuTitle.textContent = "🏁 Escolhe o nível";
  subtitle.textContent = "Cada nível fica mais rápido e difícil!";
};


backButton.onclick = function(){

  levelMenu.classList.add("hidden");
  mainMenu.classList.remove("hidden");

  menuTitle.textContent = "🏎️ Corrida Relâmpago";
  subtitle.textContent = "Desvia dos carros e chega à meta!";
};


document.querySelectorAll(".levelBtn").forEach(function(button){

  button.onclick = function(){

    setLevel(Number(button.dataset.level));

    startGame();
  };

});


startButton.onclick = function(){

  startGame();

};


/* =========================
   COMEÇAR JOGO
========================= */

function startGame(){

  running = true;

  score = 0;

  enemyTimer = 0;

  scoreText.textContent = "0";

  carX = 175;

  car.style.left = carX + "px";

  document.querySelectorAll(".enemy").forEach(function(enemy){
    enemy.remove();
  });

  menu.classList.add("hidden");

  menuTitle.textContent = "🏎️ Corrida Relâmpago";

  subtitle.textContent = "Desvia dos carros e chega à meta!";

  mainMenu.classList.remove("hidden");
  levelMenu.classList.add("hidden");

  requestAnimationFrame(gameLoop);
}


/* =========================
   CRIAR INIMIGO
========================= */

function createEnemy(){

  const enemy = document.createElement("div");

  enemy.className = "enemy";

  const roadLeft = 60;
  const roadWidth = 280;

  const lane = Math.floor(Math.random() * 3);

  const laneWidth = roadWidth / 3;

  const x =
    roadLeft +
    lane * laneWidth +
    (laneWidth - 50) / 2;

  enemy.style.left = x + "px";

  enemy.style.top = "-100px";

  game.appendChild(enemy);
}


/* =========================
   COLISÃO
========================= */

function collision(a,b){

  const r1 = a.getBoundingClientRect();
  const r2 = b.getBoundingClientRect();

  return !(
    r1.right < r2.left ||
    r1.left > r2.right ||
    r1.bottom < r2.top ||
    r1.top > r2.bottom
  );
}


/* =========================
   FIM DE JOGO
========================= */

function gameOver(){

  running = false;

  const finalScore = Math.floor(score);

  if(finalScore > best){

    best = finalScore;

    localStorage.setItem(
      "corridaBest",
      best
    );

    bestText.textContent = best;
  }

  menu.classList.remove("hidden");

  mainMenu.classList.remove("hidden");

  levelMenu.classList.add("hidden");

  menuTitle.textContent = "💥 GAME OVER!";

  subtitle.textContent =
    "Fizeste " + finalScore + " pontos.";

  startButton.textContent = "JOGAR NOVAMENTE";
}


/* =========================
   CONTROLOS
========================= */

document.addEventListener("keydown",function(e){

  if(e.key === "ArrowLeft" || e.key.toLowerCase() === "a"){

    keys.left = true;

    e.preventDefault();
  }

  if(e.key === "ArrowRight" || e.key.toLowerCase() === "d"){

    keys.right = true;

    e.preventDefault();
  }

});


document.addEventListener("keyup",function(e){

  if(e.key === "ArrowLeft" || e.key.toLowerCase() === "a"){
    keys.left = false;
  }

  if(e.key === "ArrowRight" || e.key.toLowerCase() === "d"){
    keys.right = false;
  }

});


function holdLeft(e){

  e.preventDefault();

  keys.left = true;
}


function releaseLeft(e){

  e.preventDefault();

  keys.left = false;
}


function holdRight(e){

  e.preventDefault();

  keys.right = true;
}


function releaseRight(e){

  e.preventDefault();

  keys.right = false;
}


leftButton.addEventListener("pointerdown",holdLeft);
leftButton.addEventListener("pointerup",releaseLeft);
leftButton.addEventListener("pointerleave",releaseLeft);
leftButton.addEventListener("pointercancel",releaseLeft);

rightButton.addEventListener("pointerdown",holdRight);
rightButton.addEventListener("pointerup",releaseRight);
rightButton.addEventListener("pointerleave",releaseRight);
rightButton.addEventListener("pointercancel",releaseRight);


/* =========================
   JOGO
========================= */

function gameLoop(){

  if(!running){
    return;
  }

  /* mover carro */

  if(keys.left){
    carX -= 7;
  }

  if(keys.right){
    carX += 7;
  }


  /* limites da estrada */

  if(carX < 70){
    carX = 70;
  }

  if(carX > 280){
    carX = 280;
  }

  car.style.left = carX + "px";


  /* linhas da estrada */

  document.querySelectorAll(".line").forEach(function(line){

    let y = parseFloat(line.style.top);

    y += speed;

    if(y > 600){
      y = -80;
    }

    line.style.top = y + "px";

  });


  /* criar inimigos */

  enemyTimer++;

  const spawnRate = Math.max(
    35,
    80 - level * 10
  );

  if(enemyTimer >= spawnRate){

    enemyTimer = 0;

    createEnemy();
  }


  /* mover inimigos */

  document.querySelectorAll(".enemy").forEach(function(enemy){

    let y = parseFloat(enemy.style.top);

    y += speed;

    enemy.style.top = y + "px";


    if(collision(car,enemy)){

      gameOver();

      return;
    }


    if(y > 620){

      enemy.remove();

      score += 10;

      scoreText.textContent =
        Math.floor(score);
    }

  });


  /* pontuação */

  score += 0.03;

  scoreText.textContent =
    Math.floor(score);


  requestAnimationFrame(gameLoop);
}

</script>

</body>
</html>
